name: server

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/management/go.mod
          cache-dependency-path: server/management/go.sum

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Swagger up to date
        working-directory: server/management
        run: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init && git diff --exit-code -- docs/

      - name: Test
        run: make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: server/management/coverage.out
          flags: server
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/management/go.mod
          cache-dependency-path: server/management/go.sum

      - name: Lint
        run: make lint
